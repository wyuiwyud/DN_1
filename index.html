<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POLY WEBGAME 2026 — [TÊN GAME CỦA BẠN]</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e1a;
            color: #e0e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, #1a1f3a 0%, #0b0e1a 80%);
        }
        .game-wrapper {
            max-width: 860px; width: 100%;
            background: rgba(20, 25, 50, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 30px 30px 25px;
            box-shadow: 0 20px 60px rgba(0, 80, 255, 0.2), 0 0 120px rgba(0, 60, 200, 0.05);
            border: 1px solid rgba(80, 130, 255, 0.15);
            transition: all 0.3s ease;
        }
        .game-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .game-header .logo { display: flex; align-items: center; gap: 12px; }
        .game-header .logo h1 {
            font-size: 26px; font-weight: 700;
            background: linear-gradient(135deg, #6ab0ff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;
        }
        .game-header .badge {
            background: rgba(255,255,255,0.07); padding: 6px 16px; border-radius: 40px; font-size: 13px;
            border: 1px solid rgba(255,255,255,0.08); color: #9aa8d9; white-space: nowrap;
        }
        .game-nav { display: flex; gap: 24px; margin: 6px 0 16px 0; flex-wrap: wrap; }
        .game-nav a {
            color: #8899bb; text-decoration: none; font-size: 15px; font-weight: 500; padding: 4px 0;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .game-nav a:hover, .game-nav a.active { color: #6ab0ff; border-bottom-color: #6ab0ff; }
        .stats-bar {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
            background: rgba(0,0,0,0.35); padding: 12px 20px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 16px; }
        .stat-item .icon { font-size: 20px; }
        .stat-item .value { font-weight: 700; color: #fff; min-width: 30px; transition: all 0.2s; }
        .stat-item .value.highlight { color: #6fcf97; }
        .game-area {
            background: #11162b; border-radius: 20px; overflow: hidden; border: 1px solid rgba(80,130,255,0.2);
            position: relative; box-shadow: inset 0 0 60px rgba(0,20,80,0.5);
        }
        #gameCanvas { display:block; width:100%; height:auto; aspect-ratio: 16/9; background:#0f1429; cursor:crosshair; touch-action:none; }
        .controls-section { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:16px; gap:12px; }
        .key-hint { font-size: 14px; color:#7a89b5; }
        .key-hint kbd {
            background:#1e2545; padding:4px 12px; border-radius:6px; border:1px solid #2d3660;
            font-family:inherit; color:#c8d6ff; font-size:13px;
        }
        .btn-group { display:flex; gap:10px; flex-wrap:wrap; }
        .btn {
            background:#2a3360; border:none; padding:10px 24px; border-radius:40px; font-weight:600; color:#d0dcff; font-size:14px;
            cursor:pointer; transition:all 0.2s ease; border:1px solid rgba(255,255,255,0.05); font-family:inherit;
        }
        .btn-primary { background:#4a7aff; color:#fff; border-color:#4a7aff; box-shadow:0 4px 20px rgba(74,122,255,0.25); }
        .btn-primary:hover { background:#5f8aff; transform:scale(1.02); }
        .btn-secondary { background:#1e2545; border-color:#2d3660; }
        .btn-secondary:hover { background:#2d3660; }
        .btn-danger { background:#e74c3c; color:#fff; border-color:#e74c3c; }
        .btn-danger:hover { background:#ff5e4a; transform:scale(1.02); }
        .game-footer {
            margin-top:20px; text-align:center; font-size:13px; color:#4a5a85; border-top:1px solid rgba(255,255,255,0.04);
            padding-top:16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
        }
        .game-footer a { color:#6a8aff; text-decoration:none; transition:color 0.2s; }
        .game-footer a:hover { color:#8aafff; }
        @media (max-width: 600px) {
            .game-wrapper { padding:16px; border-radius:20px; }
            .game-header .logo h1 { font-size:20px; }
            .game-header .badge { font-size:11px; padding:4px 12px; }
            .stats-bar { flex-direction:column; align-items:stretch; gap:6px; padding:10px 16px; }
            .controls-section { flex-direction:column; align-items:stretch; }
            .btn-group { justify-content:center; }
            .game-nav { gap:14px; font-size:14px; }
            .game-footer { flex-direction:column; align-items:center; gap:4px; }
        }
        @media (max-width: 400px) {
            .game-wrapper { padding:10px; }
            .game-header .logo h1 { font-size:17px; }
            .stat-item { font-size:14px; }
            .btn { padding:8px 16px; font-size:13px; }
        }
        .status-playing { color: #6fcf97 !important; }
        .status-paused { color: #f1c40f !important; }
        .status-gameover { color: #ff6b6b !important; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <div class="logo">
                <h1>🎮 [TÊN GAME CỦA BẠN]</h1>
            </div>
            <span class="badge">⚡ POLY WEBGAME 2026</span>
        </header>

        <nav class="game-nav">
            <a href="#" class="active">🏠 Trang chủ</a>
            <a href="#">📖 Hướng dẫn</a>
            <a href="#">🏆 Bảng xếp hạng</a>
            <a href="#">📞 Liên hệ</a>
        </nav>

        <div class="stats-bar">
            <div class="stat-item"><span class="icon">⭐</span><span>Điểm:</span><span class="value" id="scoreDisplay">0</span></div>
            <div class="stat-item"><span class="icon">❤️</span><span>Mạng:</span><span class="value" id="livesDisplay">3</span></div>
            <div class="stat-item"><span class="icon">⏱️</span><span>Thời gian:</span><span class="value" id="timerDisplay">90</span><span>s</span></div>
            <div class="stat-item"><span class="icon">📊</span><span>Trạng thái:</span><span class="value status-playing" id="statusDisplay">▶ Đang chơi</span></div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>

        <div class="controls-section">
            <div class="key-hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> Di chuyển &nbsp;|&nbsp; <kbd>Space</kbd> Bắn / Hành động</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="resetBtn">🔄 Chơi lại</button>
                <button class="btn btn-secondary" id="pauseBtn">⏸️ Tạm dừng</button>
                <button class="btn btn-secondary" id="fullscreenBtn">⛶ Toàn màn hình</button>
            </div>
        </div>

        <footer class="game-footer">
            <span>✨ Made with ⚡ by <strong>Pu Han</strong></span>
            <span>📅 POLY WebGame Championship 2026</span>
            <span><a href="#">GitHub</a> &middot; <a href="#">Poly Coder</a></span>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const livesSpan = document.getElementById('livesDisplay');
        const timerSpan = document.getElementById('timerDisplay');
        const statusSpan = document.getElementById('statusDisplay');

        const game = {
            running: false, paused: false, finished: false,
            score: 0, lives: 3, maxLives: 3, time: 90, timeLimit: 90,
        };

        const player = { x: 380, y: 380, w: 40, h: 40, speed: 4, color: '#6ab0ff' };
        const keys = {};
        document.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
        document.addEventListener('keyup', e => { keys[e.key] = false; });

        let timerInterval = null;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!game.paused && game.running && !game.finished) {
                    game.time--;
                    timerSpan.textContent = game.time;
                    if (game.time <= 0) gameOver('⏰ Hết giờ!');
                }
            }, 1000);
        }

        function gameOver(reason = 'Game Over') {
            if (game.finished) return;
            game.running = false; game.finished = true;
            if (timerInterval) clearInterval(timerInterval);
            statusSpan.textContent = '❌ ' + reason;
            statusSpan.className = 'value status-gameover';
        }

        function gameWin(reason = '🎉 Chiến thắng!') {
            if (game.finished) return;
            game.running = false; game.finished = true;
            if (timerInterval) clearInterval(timerInterval);
            statusSpan.textContent = '🏆 ' + reason;
            statusSpan.className = 'value status-gameover';
        }

        function resetGame() {
            game.running = true; game.paused = false; game.finished = false;
            game.score = 0; game.lives = game.maxLives; game.time = game.timeLimit;
            scoreSpan.textContent = game.score; livesSpan.textContent = game.lives; timerSpan.textContent = game.time;
            statusSpan.textContent = '▶ Đang chơi'; statusSpan.className = 'value status-playing';
            player.x = 380; player.y = 380;
            resetGameObjects();
            if (timerInterval) clearInterval(timerInterval);
            startTimer();
        }

        function resetGameObjects() { }

        function togglePause() {
            if (game.finished || !game.running) return;
            game.paused = !game.paused;
            document.getElementById('pauseBtn').textContent = game.paused ? '▶️ Tiếp tục' : '⏸️ Tạm dừng';
            statusSpan.textContent = game.paused ? '⏸ Tạm dừng' : '▶ Đang chơi';
            statusSpan.className = 'value ' + (game.paused ? 'status-paused' : 'status-playing');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
            else document.exitFullscreen?.();
        }

        let enemies = []; let bullets = []; let items = [];
        function spawnEnemy() { }
        function shoot() { }
        function updateGame() {
            if (!game.running || game.paused || game.finished) return;
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;
            if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.h) player.y += player.speed;
            if (keys[' '] && !game._lastShoot) { game._lastShoot = true; }
            if (!keys[' ']) game._lastShoot = false;
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createRadialGradient(400, 200, 100, 400, 200, 500);
            grad.addColorStop(0, '#1a254a'); grad.addColorStop(1, '#0a0f20');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(60, 90, 180, 0.06)'; ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            for (const e of enemies) {
                ctx.fillStyle = '#ff6b6b'; ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            }
            for (const b of bullets) {
                ctx.fillStyle = '#ffdd57'; ctx.shadowColor = '#ffdd57'; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            }
            ctx.shadowColor = player.color; ctx.shadowBlur = 30; ctx.fillStyle = player.color;
            ctx.beginPath(); ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w / 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            for (const it of items) { ctx.fillStyle = '#6fcf97'; ctx.shadowColor='#6fcf97'; ctx.shadowBlur=12; ctx.fillRect(it.x,it.y,it.w,it.h); ctx.shadowBlur=0; }

            if (game.finished) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const isWin = statusSpan.textContent.includes('🏆');
                ctx.fillStyle = isWin ? '#6fcf97' : '#ff6b6b'; ctx.font = 'bold 48px sans-serif';
                ctx.fillText(isWin ? '🎉 CHIẾN THẮNG!' : '💀 GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#aaa'; ctx.font = '20px sans-serif';
                ctx.fillText('Nhấn "Chơi lại" để thử lại', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function gameLoop() { updateGame(); drawGame(); requestAnimationFrame(gameLoop); }
        function rectCollide(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; }
        function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function randf(min, max) { return Math.random() * (max - min) + min; }

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

        resetGame();
        gameLoop();
        console.log('✅ Boilerplate WebGame POLY 2026 đã sẵn sàng!');
        console.log('📌 Hãy sửa phần // ==== GAME LOGIC ==== để thêm game của bạn.');
        console.log('🎯 Chúc bạn thi tốt! 💪');
    </script>
</body>
</html>
